name: Build beeped feed
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; beeped versions sometimes appear after the episode
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project TalCleanFeed -- docs/tal-clean.xml
      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/tal-clean.xml
          git diff --staged --quiet || git commit -m "Update feed"
          git push
